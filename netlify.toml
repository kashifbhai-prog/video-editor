# Netlify: build the website + editor and serve it with the right headers.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public site address (canonical links, sitemap, social cards) and the contact address shown on
  # the Contact, Privacy and Terms pages.
  VITE_SITE_URL = "https://cutistic.com"
  VITE_CONTACT_EMAIL = "sk_hashmi@yahoo.com"
  # Google Analytics 4 measurement id (public: it is part of every page). Website pages + editor events.
  VITE_GA_ID = "G-KT38D1D0XN"
  # Google AdSense publisher id (public). Ads + ads.txt on the website pages only, never in the editor.
  VITE_ADSENSE_CLIENT = "ca-pub-0639005332799636"
  # Editor "Feedback" dialog → Google Apps Script web app → Google Sheet (tools/feedback-apps-script.gs).
  # Public by design: the URL ends up in the site's JavaScript anyway.
  VITE_FEEDBACK_URL = "https://script.google.com/macros/s/AKfycbwy_tdqLST5F478r8gCbkSKFlFjoZnDOBmhtvZA5yESyERycFSPc2zohG-sgPQQQvfglw/exec"

# Optional: VITE_ADSENSE_SLOT (a display ad unit id) can be added here or in
# Site settings → Environment variables (see .env.example). Auto ads work without it.

[[redirects]]
  from = "/editor"
  to = "/editor/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # The editor records voice-overs (microphone) – nothing else is needed.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"

# Hashed build files never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
