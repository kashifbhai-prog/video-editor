<!doctype html>
<html lang="en" data-layout="site" data-nav="help" data-title="Help Center – the complete Cutistic editor guide" data-description="Step-by-step guides for every part of the Cutistic video editor: timeline editing, text, effects, audio, AI captions, silence removal, background removal and export.">
<body>
<div class="help-hero">
  <span class="kicker">Help Center</span>
  <h1>How can we help?</h1>
  <p>The complete guide to the Cutistic editor – every panel, tool and setting, explained step by step.</p>
</div>
<div class="search" role="search">
  {{searchIcon}}
  <input type="search" placeholder="Search the guides – e.g. captions, split, export 4K" aria-label="Search the help guides" autocomplete="off" data-help-search />
  <div class="search-results" data-help-results hidden></div>
</div>
{{helpIndex}}
<div class="ad-slot" data-ad="help-index"></div>
<div class="callout tip" style="margin-top:48px">
  <strong>Can't find an answer?</strong>
  <p>Write to us from the <a href="/contact/">contact page</a> – we read every message.</p>
</div>
</body>
</html>
